[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip STM32F767ZITx"

[build]
target = "thumbv7em-none-eabihf"

[env]
DEFMT_LOG = "debug"
WIFI_SSID = { value = "", force = false }
WIFI_PASS = { value = "", force = false }

[alias]
deploy = "flash --release --chip STM32F767ZITx"
