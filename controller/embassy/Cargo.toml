[package]
name = "nucleo"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nucleo"
test = false
bench = false

[dependencies]
embassy-stm32 = { version = "0.6.0", features = ["rt", "defmt", "stm32f767zi", "memory-x", "unstable-pac", "time-driver-any", "exti", "single-bank"]  }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-net = { version = "0.9.0", features = ["defmt", "tcp", "dhcpv4", "medium-ethernet"] }
embedded-io-async = { version = "0.7.0" }
embedded-io = { version = "0.7.0" }
embassy-usb = { version = "0.6.0", features = ["defmt"] }
embassy-futures = { version = "0.1.0" }

defmt = { version = "1.0.1", features = ["alloc"] }
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
embedded-hal = "0.2.6"
#panic-probe = { version = "1.0.0", features = ["print-defmt"] }
#heapless = { version = "0.9", default-features = false }
nb = "1.0.0"
critical-section = "1.1"
embedded-storage = "0.3.1"
static_cell = "2"
hmac = "0.12.1"
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "heapless"] }
const_format = "0.2.36"
embedded-alloc = "0.7.0"
#stm32f7 = { version = "0.16.0", features = ["stm32f767"] }

monsters-codes = { path = "../../common/codes" }

[profile.dev]
opt-level = 0
debug = 2
lto = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = 2
panic = "abort"

